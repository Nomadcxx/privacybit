category:
  id: passwords
  name: Password manager
  summary: >-
    A password manager is the one piece of software that should know all your
    secrets. Proprietary and closed-source managers are a concentration risk
    and a disclosure risk at the same time, and several have had breaches or
    insider incidents.
  expectations:
    - id: passwords.present
      title: No password manager available
      any_of: [bitwarden, pass, gopass, keepassxc, proton-pass, aliasvault, padloc]
      severity: high
      why: >-
        Nothing is generating, storing and autofilling credentials for you, so
        every account you have is being reused or written on paper.
    - id: passwords.local-first
      title: No local-first password manager available
      any_of: [pass, gopass, keepassxc, aliasvault]
      severity: low
      why: >-
        Your whole credential database leaves the machine every time you
        authenticate, held by a company you cannot audit.
  entries:
    # --- red ---------------------------------------------------------------
    - id: 1password
      name: 1Password
      grade: red
      summary: >-
        Well-made commercial password manager, but the vault is held by the
        vendor and the client is closed source.
      reasons:
        - Your entire credential database is stored on vendor infrastructure.
        - Closed-source client, so the local handling of secrets cannot be
          independently verified.
        - Vendor-side breach is the single largest risk to a password manager,
          and this one holds the vault.
      caveats:
        - The service is professionally run and has a good security record in
          public, but that is not the same as being verifiable.
      alternatives:
        - bitwarden
        - keepassxc
        - pass
      detects:
        - {type: package, name: 1password}
        - {type: package, name: 1password-cli}
        - {type: flatpak, name: com.1password.1Password}
      install:
        upstream: https://1password.com/download

    - id: lastpass
      name: LastPass
      grade: red
      summary: >-
        Commercial password manager with a history of vault-side incidents,
        including encrypted vaults being accessed from vendor systems and
        later reports of phishing compromise of accounts.
      reasons:
        - Vault breach incidents, including reports of attacker access to
          decrypted vault data from vendor infrastructure.
        - Phishing campaigns specifically targeting LastPass users at scale.
        - Closed-source client and vendor-held vault.
      alternatives:
        - bitwarden
        - keepassxc
        - pass
      detects:
        - {type: package, name: lastpass}
        - {type: flatpak, name: com.lastpass.LastPass}
      install:
        upstream: https://lastpass.com

    - id: dashlane
      name: Dashlane
      grade: red
      summary: >-
        Commercial password manager, closed source, vendor-held vault.
      reasons:
        - Credential vault stored on vendor infrastructure.
        - Closed-source client.
        - Business model depends on a subscription, so the free tier is
          deliberately hobbled toward cloud sync.
      alternatives:
        - bitwarden
        - keepassxc
      detects:
        - {type: package, name: dashlane}
        - {type: flatpak, name: com.dashlane.Dashlane}
      install:
        upstream: https://dashlane.com/download

    - id: enpass
      name: Enpass
      grade: red
      summary: >-
        Commercial password manager whose security model is explicitly
        "zero-knowledge" vendor-side but which is closed source.
      reasons:
        - Closed-source client, so the local handling of the master password
          cannot be verified independently.
        - Vendor-held encrypted vault.
      alternatives:
        - keepassxc
        - bitwarden
      detects:
        - {type: package, name: enpass}
        - {type: flatpak, name: com.enpass.Enpass}
      install:
        upstream: https://www.enpass.io/download/

    # --- amber -------------------------------------------------------------
    - id: keepassxc
      name: KeePassXC
      grade: amber
      summary: >-
        Local encrypted database, open source. Amber rather than green because
        the default is a local file you must move between machines yourself.
      reasons:
        - The database is a local encrypted file. No vendor, no account, no
          server.
        - Open source and independently auditable.
        - AES-256 with a well-understood KDF.
      caveats:
        - No built-in sync means the file is on exactly the machines you put it
          on. Syncing it yourself is the usual answer, and a synced
          plaintext copy is the usual mistake.
        - Local-only means no phone-number-based recovery either — lose the
          database and the passwords are gone.
      alternatives:
        - bitwarden
        - pass
        - gopass
      detects:
        - {type: package, name: keepassxc}
        - {type: binary, name: keepassxc}
        - {type: flatpak, name: org.keepassxc.KeePassXC}
      install:
        package:
          arch: keepassxc
          debian: keepassxc
          fedora: keepassxc
          suse: keepassxc
        upstream: https://keepassxc.org

    - id: proton-pass
      name: Proton Pass
      grade: amber
      summary: >-
        End-to-end encrypted and open source, from a vendor with a defensible
        privacy record. Amber because the whole value is in the cloud round
        trip.
      reasons:
        - End-to-end encrypted; the server holds ciphertext only.
        - Open source clients, published for audit.
        - Proton operates under Swiss jurisdiction with a public privacy
          practice.
      caveats:
        - Syncing requires an account and therefore an identity, even if the
          contents are opaque to the vendor.
        - The security of the whole scheme rests on the client, which is where
          it should rest, but it also means no offline-only use.
      alternatives:
        - keepassxc
        - bitwarden
      detects:
        - {type: package, name: proton-pass}
        - {type: flatpak, name: me.proton.Pass}
      install:
        package:
          arch: proton-pass
        upstream: https://proton.me/pass

    - id: padloc
      name: Padloc
      grade: amber
      summary: >-
        Open-source, end-to-end encrypted password manager with a smaller
        footprint and a smaller user base.
      reasons:
        - Open source client and protocol.
        - End-to-end encrypted sync.
      caveats:
        - Very small project and user base, so operational longevity is less
          certain.
        - Requires an account for sync, as above.
      alternatives:
        - bitwarden
        - keepassxc
      detects:
        - {type: package, name: padloc}
        - {type: flatpak, name: com.padloc.app}
      install:
        upstream: https://padloc.app

    # --- green -------------------------------------------------------------
    - id: bitwarden
      name: Bitwarden
      grade: green
      summary: >-
        Open-source client, end-to-end encrypted sync, and a self-hostable
        server. The vault is encrypted before it leaves the device.
      reasons:
        - Open source client, protocol and, if wanted, the server.
        - End-to-end encryption, where the server holds ciphertext it cannot read.
        - Self-hostable, so the server can be your own machine.
        - Broad cross-platform support without a vendor lock.
      caveats:
        - Vaultwarden, the community server, is far more commonly deployed than
          the official server, so "self-hosted" usually means that.
        - Requires an account to sync, though it need not be a Bitwarden one if
          self-hosting.
      alternatives:
        - keepassxc
        - pass
      detects:
        - {type: package, name: bitwarden}
        - {type: package, name: bitwarden-desktop}
        - {type: binary, name: bitwarden}
        - {type: flatpak, name: com.bitwarden.desktop}
      install:
        package:
          arch: bitwarden
          debian: bitwarden-desktop
          fedora: bitwarden
          suse: bitwarden-desktop
        upstream: https://bitwarden.com/download/

    - id: pass
      name: pass
      grade: green
      summary: >-
        Standard Unix password manager. The database is an encrypted git
        repository, and GnuPG does the cryptography.
      reasons:
        - No vendor, no account, no server beyond whatever git remote you choose.
        - Uses the system's existing GnuPG and git, so there is no new crypto to
          trust.
        - A plain encrypted git tree is auditable and diffable.
      caveats:
        - Requires comfort with a command line and with gpg.
        - The git remote you pick becomes the backup that matters; choose
          something you trust with ciphertext.
      alternatives:
        - gopass
        - keepassxc
      detects:
        - {type: package, name: pass}
        - {type: binary, name: pass}
      install:
        package:
          arch: pass
          debian: pass
        upstream: https://www.passwordstore.org

    - id: gopass
      name: gopass
      grade: green
      summary: >-
        Maintained successor to pass, with better recipient handling and browser
        integration, using the same encrypted-git model.
      reasons:
        - Same model as pass — encrypted git repository, GnuPG by default.
        - Better support for multiple recipients and for hardware-backed keys.
        - Actively maintained where pass is largely stable.
      caveats:
        - Requires comfort with a command line.
      alternatives:
        - pass
        - keepassxc
      detects:
        - {type: package, name: gopass}
        - {type: binary, name: gopass}
      install:
        package:
          arch: gopass
          debian: gopass
          fedora: gopass
        upstream: https://www.gopass.pw

    - id: aliasvault
      name: AliasVault
      grade: green
      summary: >-
        Local-first, encrypted sync, with the option of self-hosting the whole
        stack.
      reasons:
        - End-to-end encrypted sync.
        - Local-first, so the working copy of your vault is on the device.
        - Self-hostable, and self-hostable offline if you want.
      caveats:
        - Younger project with a smaller user base than Bitwarden or KeePassXC.
      alternatives:
        - bitwarden
        - keepassxc
      detects:
        - {type: package, name: aliasvault}
        - {type: flatpak, name: app.aliasvault.AliasVault}
      install:
        package:
          arch: aliasvault
        upstream: https://aliasvault.app